name: Build KMP iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform iOS Framework
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Build iOS App with Xcodebuild (Unsigned)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r iosApp/derivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r loewe-remote-kmp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loewe-remote-kmp-ipa
          path: build/loewe-remote-kmp.ipa
